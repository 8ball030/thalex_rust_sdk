[package]
name = "thalex_rust_sdk"
version = "0.1.61"
edition = "2024"
description = "Trading client for Thalex exchange"
repository = "https://github.com/8ball030/thalex_rust_sdk"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.54.1", features = ["fs", "time", "sync", "rt-multi-thread", "macros"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4.34"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
thiserror = "2.0.21"
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws-lc-rs"] }
yawc = { version = "0.5.0", default-features = false, features = ["rustls-aws-lc-rs"] }
serde_repr = "0.1.21"
dashmap = "6.2.1"
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40.0"
bytes = "1.12.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
simple_logger = "5.2.0"
dotenv = "0.15.0"
csv = "1.4.0"
serial_test = { version = "4.0.1", features = ["async"] }
rust_decimal_macros = "1.40.0"
rust_decimal = "1.43.0"
chrono = "0.4.45"
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
tokio-test = "0.4"

[[bench]]
name = "json_parsing"
harness = false

[[bench]]
name = "handle_incoming"
harness = false

[[bench]]
name = "mutex_contention"
harness = false

[[bench]]
name = "subscription_throughput"
harness = false

[profile.dev]
opt-level = 0
debug = 0

[package.metadata.cargo-machete]
ignored = ["rustls"]

