name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Codegen tools come from the pinned shell.nix, so CI generates with the same versions as local.
      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit
        run: make audit

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Codegen
        run: nix-shell --run 'make codegen'

      - name: Format
        run: make fmt

      - name: Lint
        run: make lint

      - name: Check generated code is up to date
        run: git diff --exit-code

      - name: Build
        run: make build

      - name: Test
        run: make test

